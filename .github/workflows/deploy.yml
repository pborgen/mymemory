name: Deploy

# Pushes to main update AWS:
#   - apps/api/**  → build/push ECR image → App Runner redeploy
#   - apps/web/**  → static export → S3 sync → CloudFront invalidate
#
# Requires repo Variables (Settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, ECR_REPOSITORY,
#   WEB_BUCKET, WEB_CLOUDFRONT_DISTRIBUTION_ID,
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_SITE_URL
# Auth is keyless via GitHub OIDC — no stored AWS keys.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy API (App Runner)"
        type: boolean
        default: true
      deploy_web:
        description: "Deploy web (S3 + CloudFront)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  changes:
    name: detect paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/deploy.yml'

  api:
    name: API → ECR + App Runner
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_api == true) ||
      (github.event_name == 'push' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -f apps/api/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Trigger App Runner deployment
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SERVICE_NAME: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          ARN=$(aws apprunner list-services --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='${SERVICE_NAME}'].ServiceArn | [0]" \
            --output text)
          if [ "$ARN" = "None" ] || [ -z "$ARN" ]; then
            echo "App Runner service '${SERVICE_NAME}' not found; skipping explicit deploy."
            echo "(auto_deployments_enabled will redeploy from the new :latest image.)"
            exit 0
          fi
          STATUS=$(aws apprunner describe-service --region "$AWS_REGION" --service-arn "$ARN" \
            --query 'Service.Status' --output text)
          echo "Service status: $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Service already deploying/updating ($STATUS); auto_deployments_enabled will finish."
            exit 0
          fi
          echo "Starting deployment for $ARN"
          if ! aws apprunner start-deployment --region "$AWS_REGION" --service-arn "$ARN"; then
            echo "StartDeployment failed (often a race with auto_deployments); image already pushed."
            exit 0
          fi

  web:
    name: Web → S3 + CloudFront
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_web == true) ||
      (github.event_name == 'push' && needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build static export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if [ ! -d out ]; then
            echo "Missing apps/web/out — next build did not produce a static export." >&2
            exit 1
          fi
          if [ ! -f out/404.html ] && [ -f out/404/index.html ]; then
            cp out/404/index.html out/404.html
          elif [ ! -f out/404.html ]; then
            cp out/index.html out/404.html
          fi

      - name: Sync to S3 and invalidate CloudFront
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BUCKET: ${{ vars.WEB_BUCKET }}
          DIST_ID: ${{ vars.WEB_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync apps/web/out/ "s3://$BUCKET/" --delete --region "$AWS_REGION" \
            --cache-control "public,max-age=300" \
            --exclude "*.html"
          aws s3 sync apps/web/out/ "s3://$BUCKET/" --region "$AWS_REGION" \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=60" \
            --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text
          echo "Web: ${{ vars.NEXT_PUBLIC_SITE_URL }}"
