# Local Mac/dev stack: Postgres + pgvector (required) and optional Redis.
# Usage: npm run db:up   (or: docker compose up -d)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mymemory-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mymemory
    ports:
      - "5544:5432"
    volumes:
      - mymemory-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: mymemory-redis
    ports:
      - "6379:6379"
    profiles:
      - redis

volumes:
  mymemory-pg-data:
